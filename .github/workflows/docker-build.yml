name: VerifAI CI

on:
  push:

  pull_request:
    branches: ["main"]

jobs:
  build-images:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - web
          - master-service
          - resume-analyzer
          - coding-analyzer
          - marksheet-analyzer
          - jd-analyzer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build \
            --file "${{ matrix.service }}/Dockerfile.prod" \
            --tag "verifai-${{ matrix.service }}:ci" \
            "${{ matrix.service }}"
