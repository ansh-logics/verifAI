name: VerifAI CI

on:
  push:

  pull_request:
    branches: ["main"]

jobs:
  build-images:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - web
          - master-service
          - resume-analyzer
          - coding-analyzer
          - marksheet-analyzer
          - jd-analyzer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build \
            --file "${{ matrix.service }}/Dockerfile.prod" \
            --tag "verifai-${{ matrix.service }}:ci" \
            "${{ matrix.service }}"
  test-master-service:
    name: Test master service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: master-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: master-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
