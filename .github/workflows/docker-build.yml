name: VerifAI CI

on:
  push:

  pull_request:
    branches: ["main"]

jobs:
  build-images:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - web
          - master-service
          - resume-analyzer
          - coding-analyzer
          - marksheet-analyzer
          - jd-analyzer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build \
            --file "${{ matrix.service }}/Dockerfile.prod" \
            --tag "verifai-${{ matrix.service }}:ci" \
            "${{ matrix.service }}"
  test-python-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - master-service
          - resume-analyzer
          - marksheet-analyzer
          - jd-analyzer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: pip install -r requirements.txt

      - name: Install resume language model
        if: matrix.service == 'resume-analyzer'
        working-directory: resume-analyzer
        run: python -m spacy download en_core_web_sm

      - name: Run unit tests
        working-directory: ${{ matrix.service }}
        run: python -m unittest discover -s tests -v
